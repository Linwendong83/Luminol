name: Lophine CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lophine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git User Details
        run: |
          git config --global user.email "ci@linwendong83.dev"
          git config --global user.name "Luminol Fork CI"
          chmod +x gradlew

      - name: Apply All Patches
        run: ./gradlew --refresh-dependencies applyAllPatches

      - name: Test Custom Plugin Contracts
        run: >-
          ./gradlew
          :lophine-api:test --tests me.earthme.luminol.api.TeleportEventContractTest
          :lophine-server:test --tests me.earthme.luminol.CustomApiTestSuite

      - name: Build Paperclip Jar
        run: ./gradlew --refresh-dependencies createPaperclipJar

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lophine-26.2-ci-${{ github.sha }}
          path: lophine-server/build/libs/*-paperclip-*.jar
          if-no-files-found: error
          retention-days: 14
