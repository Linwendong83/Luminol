name: Sync Upstream

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync from upstream"
        required: false
        default: "ver/26.1.2"
      run-build:
        description: "Dispatch an extra Luminol CI run after syncing"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-${{ inputs.branch || 'ver/26.1.2' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Linwendong83/Luminol'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      synced_sha: ${{ steps.sync.outputs.synced_sha }}
      used_sync_token: ${{ steps.sync.outputs.used_sync_token }}
    env:
      UPSTREAM_REPOSITORY: LuminolMC/Luminol
      SYNC_BRANCH: ${{ inputs.branch || 'ver/26.1.2' }}
    steps:
      - name: Detect Upstream Changes
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail

          urlencode() {
            jq -rn --arg value "$1" '$value|@uri'
          }

          base_branch="$(urlencode "${SYNC_BRANCH}")"
          head_branch="$(urlencode "${SYNC_BRANCH}")"
          compare_path="repos/${UPSTREAM_REPOSITORY}/compare/${base_branch}...${GITHUB_REPOSITORY_OWNER}:${head_branch}"

          if ! behind_by="$(gh api "${compare_path}" --jq '.behind_by' 2>/tmp/compare-error.log)"; then
            echo "Could not compare fork with upstream. Falling back to merge check."
            cat /tmp/compare-error.log
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${behind_by}" = "0" ]; then
            echo "Branch already contains upstream/${SYNC_BRANCH}."
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "upstream/${SYNC_BRANCH} is ${behind_by} commit(s) ahead."
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout Fork
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SYNC_BRANCH }}
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge Upstream
        if: steps.detect.outputs.has_changes == 'true'
        id: sync
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${SYNC_TOKEN}" ]; then
            echo "used_sync_token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "used_sync_token=false" >> "${GITHUB_OUTPUT}"
          fi

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch origin "${SYNC_BRANCH}"
          git fetch upstream "${SYNC_BRANCH}"
          git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"

          if git merge-base --is-ancestor "upstream/${SYNC_BRANCH}" HEAD; then
            echo "Branch already contains upstream/${SYNC_BRANCH}."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "synced_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git merge --no-edit --no-commit --no-ff "upstream/${SYNC_BRANCH}"

          # Refuse to push a tree with unresolved merge conflicts. A broken
          # upstream sync (e.g. conflicting .patch files) must fail loudly here
          # instead of being committed and discovered later by the build job.
          conflict_files="$(git diff --cached --name-only --diff-filter=U)"
          if [ -n "${conflict_files}" ]; then
            git merge --abort
            {
              echo "::error::Upstream sync produced merge conflicts in the following files; refusing to push a broken state:"
              printf '::error:: %s\n' ${conflict_files}
              echo "::error::Merge aborted. Resolve the conflicts manually and rerun this workflow."
            }
            exit 1
          fi

          if git diff --cached --name-only -- .github/workflows | grep -q . && [ -z "${SYNC_TOKEN}" ]; then
            git merge --abort
            {
              echo "::error::Sync would update files under .github/workflows, but GITHUB_TOKEN cannot push workflow file changes."
              echo "::error::Add an Actions secret named SYNC_TOKEN with repository contents write access and workflow write permission, then rerun this workflow."
            }
            exit 1
          fi

          git commit --no-edit

          # Belt-and-braces: never push a tree that still carries conflict markers,
          # in case an upstream file contains literal `<<<<<<<`/`=======`/`>>>>>>>`
          # sequences that git did not flag as unmerged.
          if git diff --cached --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unexpected unresolved conflict after commit; aborting push."
            exit 1
          fi

          echo "synced_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          git push origin "HEAD:${SYNC_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

  build-after-sync:
    name: Build Synced Commit
    needs: sync
    if: needs.sync.outputs.changed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs['run-build'] == 'true') || github.event_name == 'schedule')
    permissions: write-all
    uses: ./.github/workflows/build.yml
    with:
      checkout-ref: ${{ needs.sync.outputs.synced_sha }}
      source-branch: ${{ inputs.branch || 'ver/26.1.2' }}
    secrets: inherit
