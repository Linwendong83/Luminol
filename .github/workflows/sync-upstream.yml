name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-ver-26.2-hardfork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPOSITORY: LophineLabs/Lophine
      UPSTREAM_BRANCH: ver/26.2-hardfork
      TARGET_BRANCH: ver/26.2-hardfork

    steps:
      - name: Check For Upstream Updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)

          echo "Upstream: ${UPSTREAM_SHA}"

          if [ -z "${UPSTREAM_SHA}" ]; then
            echo "Could not resolve upstream branch."
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/commits/${UPSTREAM_SHA}" --silent >/dev/null 2>&1; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Upstream commit already exists in this fork."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Upstream update detected."
          fi

      - name: Checkout Target Branch
        if: steps.check.outputs.update == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge Upstream
        id: merge
        if: steps.check.outputs.update == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BEFORE_SHA=$(git rev-parse HEAD)

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

          AFTER_SHA=$(git rev-parse HEAD)
          if [ "${BEFORE_SHA}" = "${AFTER_SHA}" ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date after fetching upstream."
            exit 0
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Trigger Build
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
